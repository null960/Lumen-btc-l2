[package]
name = "lumen-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
solana-sdk = "1.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4.0", features = ["derive"] } # For command line arguments