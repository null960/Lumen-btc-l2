[package]
name = "node"
version = "2.0.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode    = "1.3"

# Bitcoin
bitcoin  = { version = "0.30.2", features = ["rand", "secp-recovery"] }
reqwest  = { version = "0.11",   features = ["json"] }
base64   = "0.21"

# Web framework
axum = "0.7"

# Utilities
chrono             = "0.4"
rand               = "0.8"
sha2               = "0.10"
dotenvy            = "0.15"
tracing-subscriber = "0.3"
clap               = { version = "4.0", features = ["derive"] }

# Database
redb = "1.3"

[[bin]]
name = "node"
path = "src/main.rs"

[[bin]]
name = "cli"
path = "src/bin/cli.rs"