[package]
name = "node"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3" 

tracing = "0.1"
tracing-subscriber = "0.3"

hex = "0.4"
uuid = { version = "1.4", features = ["v4"] }
base64 = "0.21" 
rand = "0.8"   

reqwest = { version = "0.11", features = ["json"] } # Вернули reqwest

redb = "1.0"

bitcoincore-rpc = "0.17"
bitcoin = { version = "0.30", features = ["rand", "serde"] }