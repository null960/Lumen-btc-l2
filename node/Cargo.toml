[package]
name = "node"
version = "2.0.0"
edition = "2021"

[dependencies]
# Async
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode    = "1.3"

# Bitcoin & Lightning
bitcoin   = { version = "0.30.2", features = ["rand", "secp-recovery"] }
ldk-node  = "0.2"
reqwest   = { version = "0.11", features = ["json"] }
base64    = "0.21"
hex       = "0.4"

# Web
axum = "0.7"

# Crypto — for API key hashing and webhook HMAC signatures
sha2 = "0.10"
hmac = "0.12"

# Utils
chrono             = { version = "0.4", features = ["serde"] }
rand               = "0.8"
uuid               = { version = "1.6", features = ["v4"] }
dotenvy            = "0.15"
tracing            = "0.1"
tracing-subscriber = "0.3"
clap               = { version = "4.0", features = ["derive"] }

# Database
redb = "1.3"

[[bin]]
name = "node"
path = "src/main.rs"