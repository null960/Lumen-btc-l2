[package]
name = "node"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bitcoin = { version = "0.30.2", features = ["rand", "secp-recovery"] }
reqwest = { version = "0.11", features = ["json"] }
clap = { version = "4.0", features = ["derive"] }
chrono = "0.4"
base64 = "0.21"
axum = "0.7"
solana-sdk = "1.16"
rand = "0.8"
wasmi = "0.31"
redb = "1.3"
bincode = "1.3"
tracing-subscriber = "0.3"