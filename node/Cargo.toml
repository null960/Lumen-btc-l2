[package]
name = "node"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.37", features = ["full"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

tracing = "0.1"
tracing-subscriber = "0.3"

redb = "2.1.0"
bincode = "1.3"

reqwest = { version = "0.11", features = ["json"] }

bitcoincore-rpc = "0.17"

base64 = "0.21"
uuid = { version = "1.4", features = ["v4"] }
hex = "0.4"