<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen L2 Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Courier New', Courier, monospace; }
        .glass { background: rgba(22, 27, 34, 0.8); backdrop-filter: blur(10px); border: 1px solid #30363d; }
    </style>
</head>
<body class="p-6">
    <header class="mb-8 flex justify-between items-center glass p-4 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold text-orange-500">🟠 Lumen BTC L2</h1>
        <div id="status" class="text-gray-500 font-bold">Checking...</div>
    </header>

    <div class="mb-8 glass p-4 rounded-lg flex gap-4 shadow-lg">
        <input type="text" id="searchInput" placeholder="Search Address Balance..." class="w-full bg-gray-900 border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-orange-500">
        <button onclick="search()" class="bg-orange-600 hover:bg-orange-700 px-8 py-3 rounded text-white font-bold transition">Search</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="glass p-6 rounded-lg shadow-lg">
            <h2 class="text-xl font-bold text-white mb-4 border-b border-gray-700 pb-2">Network Info</h2>
            <ul class="space-y-4">
                <li class="flex justify-between items-center"><span>Network:</span> <span class="bg-blue-900 text-blue-300 px-2 py-1 rounded text-sm">Testnet3</span></li>
                <li class="flex justify-between items-center"><span>VM Engine:</span> <span class="bg-purple-900 text-purple-300 px-2 py-1 rounded text-sm">SVM</span></li>
                <li class="flex justify-between items-center"><span>State:</span> <span class="text-green-400 font-bold">Synchronized</span></li>
            </ul>
        </div>

        <div class="glass p-6 rounded-lg shadow-lg">
            <h2 class="text-xl font-bold text-white mb-4 border-b border-gray-700 pb-2">Live Mempool</h2>
            <div id="blocks" class="space-y-2 text-sm text-gray-400">
                <div class="p-3 bg-gray-800 rounded border-l-4 border-orange-500">Listening for new transactions...</div>
            </div>
        </div>
    </div>

    <div id="resultArea" class="mt-8 glass p-6 rounded-lg hidden shadow-lg">
        <h2 class="text-xl font-bold text-white mb-4">Query Result</h2>
        <pre id="resultData" class="text-sm text-green-400 overflow-x-auto bg-gray-900 p-4 rounded border border-gray-800"></pre>
    </div>

    <script>
        // Config
        const RPC = window.location.origin;

        // Update
        async function updateStatus() {
            try {
                const res = await fetch(`${RPC}/status`);
                if (res.ok) {
                    document.getElementById('status').innerText = '🟢 Connected';
                    document.getElementById('status').className = 'text-green-400 font-bold animate-pulse';
                }
            } catch (e) {
                document.getElementById('status').innerText = '🔴 Offline';
                document.getElementById('status').className = 'text-red-500 font-bold';
            }
        }

        // Search
        async function search() {
            const addr = document.getElementById('searchInput').value;
            if (!addr) return;
            
            document.getElementById('resultArea').classList.remove('hidden');
            document.getElementById('resultData').innerText = 'Loading...';

            try {
                const res = await fetch(`${RPC}/balance/${addr}`);
                if (res.ok) {
                    const data = await res.text();
                    document.getElementById('resultData').innerText = `Address: ${addr}\nBalance: ${data} LBTC`;
                } else {
                    document.getElementById('resultData').innerText = 'Account not found or zero balance.';
                }
            } catch (e) {
                document.getElementById('resultData').innerText = 'Network error.';
            }
        }

        // Loop
        setInterval(updateStatus, 3000);
        updateStatus();
    </script>
</body>
</html>
